<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17231d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Groundwork">
<title>Groundwork · Training log</title>
<style>
:root{color-scheme:light;--bg:#f3f3ec;--card:#fffefa;--ink:#18251f;--mut:#748078;--acc:#c7f36b;--onacc:#19251d;--line:#e4e7dc;--ok:#2f8356;--bad:#bd5546;--soft:#eaf1df;--shadow:0 8px 26px #27382b0a}
@media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#121914;--card:#1c261f;--ink:#f2f4ed;--mut:#a0ada2;--acc:#c7f36b;--onacc:#19251d;--line:#303b32;--ok:#78d69d;--bad:#ff8a79;--soft:#293729;--shadow:0 8px 26px #0003}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding:calc(env(safe-area-inset-top,0px) + 25px) 18px calc(env(safe-area-inset-bottom,0px) + 94px)}
main{max-width:520px;margin:0 auto}
h1{font-size:30px;line-height:1.12;margin:0 0 20px;letter-spacing:-.045em}
h2{font-size:19px;letter-spacing:-.025em;margin:0 0 8px}
.eyebrow{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.12em;font-weight:750;margin:0 0 7px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:19px;margin-bottom:14px;box-shadow:var(--shadow)}
.card p{margin:5px 0 12px}
.muted{color:var(--mut);font-size:14px}
button,select,input{font:inherit;color:inherit}
button{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:11px 15px;min-height:46px;cursor:pointer;font-weight:650}
button.pri{background:var(--acc);color:var(--onacc);border-color:var(--acc);font-weight:800;width:100%}
button.dng{color:var(--bad);border-color:var(--bad);background:transparent}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
input,select{background:var(--bg);border:1px solid var(--line);border-radius:13px;padding:11px 13px;width:100%;min-height:48px}
label{display:block;font-size:13px;color:var(--mut);font-weight:650;margin:12px 0 5px}
.row{display:flex;gap:9px;align-items:center}.row>*{flex:1}
.big{font-size:21px;font-weight:780;font-variant-numeric:tabular-nums}
.counter{display:flex;align-items:center;gap:8px;margin:10px 0}
.counter button{width:58px;flex:none;font-size:25px;font-weight:750;min-height:60px;padding:0}
#cur{flex:1;min-width:0;text-align:center;font-size:62px;font-weight:820;border:0;background:transparent;font-variant-numeric:tabular-nums;padding:0}
.tap{font-size:18px;font-weight:800;width:100%;min-height:76px;background:var(--ink);color:var(--bg);border-radius:17px;margin-bottom:10px}
.timer{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums;font-weight:750}
.rest{color:var(--ok)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:14px;font-variant-numeric:tabular-nums;min-height:0;background:transparent}
.chip.done{background:var(--ok);border-color:var(--ok);color:#fff}
.chip.x::after{content:" \00d7";opacity:.7}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stats .card{margin:0}.stats b{display:block;font-size:29px;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin:9px 0 12px}.bar i{display:block;height:100%;background:var(--acc)}
.seg{display:flex;gap:6px;margin-bottom:8px}.seg button{flex:1;padding:7px;min-height:40px}.seg .on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sport-switch{display:flex;gap:5px;padding:4px;margin:0 0 20px;background:var(--soft);border-radius:15px}
.sport-switch button{flex:1;min-height:42px;padding:8px;border:0;background:transparent;color:var(--mut);border-radius:11px}
.sport-switch button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
svg{width:100%;height:auto;display:block}
.hist{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 0;border-top:1px solid var(--line)}
.hist small{display:block;color:var(--mut)}
.exercise{padding:15px 0;border-top:1px solid var(--line)}
.exercise-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.exercise-count{font-size:38px;line-height:1;font-weight:820;font-variant-numeric:tabular-nums;min-width:74px;text-align:center}
.stepper{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:12px}
.stepper button{min-height:40px;padding:5px 2px;font-size:13px;border-radius:11px}
.badge{display:inline-flex;align-items:center;border-radius:999px;background:var(--soft);padding:5px 10px;font-size:12px;font-weight:750}
nav{position:fixed;z-index:5;left:0;right:0;bottom:0;display:flex;justify-content:center;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:7px 10px calc(env(safe-area-inset-bottom,0px) + 7px)}
nav button{flex:1;max-width:140px;border:0;background:transparent;border-radius:14px;min-height:52px;color:var(--mut);padding:5px;font-size:13px}
nav button.on{color:var(--ink);background:var(--soft);font-weight:800}
.checkrow{display:flex;align-items:center;gap:10px;padding:5px 0;border-bottom:1px solid var(--line);user-select:none}
.checkrow input{width:20px;height:20px;min-height:0;accent-color:var(--ok)}
.checkrow .exercise-name{flex:1}
.drag-handle{touch-action:none;cursor:grab;min-height:40px;width:40px;padding:0;border:0;background:transparent;color:var(--mut);font-size:20px}
.checkrow.dragging{position:fixed;z-index:10;opacity:.94;background:var(--card);box-shadow:0 10px 26px #17231d30;border-radius:12px;pointer-events:none}
.checkrow-placeholder{border:1px dashed var(--mut);border-radius:12px;background:var(--soft);margin:5px 0}
.exercise-thumb-button{display:block;width:48px;height:48px;min-height:48px;padding:0;flex:none;overflow:hidden;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.exercise-thumb-button img{display:block;width:100%;height:100%;object-fit:cover}
.exercise-thumb-button:hover{border-color:var(--ok)}
.exercise-thumb-placeholder{display:grid;place-items:center;width:48px;height:48px;flex:none;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--mut);font-size:11px;text-align:center}
.exercise-dialog{width:min(92vw,520px);max-height:min(88dvh,760px);padding:0;overflow:auto;border:1px solid var(--line);border-radius:24px;background:var(--card);color:var(--ink);box-shadow:0 24px 80px #0006}
.exercise-dialog::backdrop{background:#101811a8;backdrop-filter:blur(3px)}
.exercise-dialog-content{padding:20px}
.exercise-dialog-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
.exercise-dialog-head h2{font-size:22px;margin:0}
.exercise-dialog-close{width:42px;min-height:42px;padding:0;font-size:22px;line-height:1}
.exercise-picture{display:block;width:100%;max-height:56dvh;object-fit:contain;border-radius:16px;background:var(--bg)}
.exercise-picture-note{margin:11px 0 0;color:var(--mut);font-size:14px}
.exercise-no-picture{display:grid;place-items:center;min-height:190px;padding:24px;text-align:center;border-radius:16px;background:var(--bg);color:var(--mut)}
.exercise-credit{margin:16px 0 0;padding-top:12px;border-top:1px solid var(--line);font-size:13px;color:var(--mut)}
.exercise-credit a{color:inherit;font-weight:700}
.hero{background:var(--ink);color:var(--bg);border-radius:24px;padding:23px;margin-bottom:14px}
.hero .muted{color:color-mix(in srgb,var(--bg) 70%,transparent)}
.hero h2{font-size:24px}
.suggest{border-color:color-mix(in srgb,var(--ok) 40%,var(--line));background:var(--soft)}
.kb-workout{display:flex;flex-direction:column;gap:8px}
.kb-workout-head .eyebrow{margin-bottom:2px}
.kb-workout-head h1{font-size:25px;margin:0}
.kb-summary{display:flex;flex:1;flex-direction:column;min-height:110px;margin:0;padding:12px}
.kb-summary-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:7px;font-size:14px;font-weight:750}
.kb-summary-head .badge{white-space:nowrap}
.kb-set-list{min-height:0;overflow:auto}
.kb-set-row{display:flex;align-items:center;gap:8px;padding:5px 0;border-top:1px solid var(--line);font-size:14px}
.kb-set-row span:first-child{min-width:0;flex:1}
.kb-set-reps{font-variant-numeric:tabular-nums;font-weight:800;white-space:nowrap}
.kb-set-remove{width:34px;min-height:34px;padding:0;color:var(--mut);border:0;background:transparent;font-size:20px}
.kb-add{margin:0;padding:12px}
.kb-add h2{font-size:15px;margin:0 0 6px}
.kb-exercise-picker{position:relative}
.kb-exercise-picker summary{display:flex;align-items:center;gap:8px;min-height:42px;padding:5px 10px;border:1px solid var(--line);border-radius:13px;background:var(--bg);cursor:pointer;list-style:none;font-weight:650}
.kb-exercise-picker summary::-webkit-details-marker{display:none}
.kb-picker-thumb{display:block;width:32px;height:32px;flex:none;object-fit:cover;border-radius:8px;background:var(--soft)}
.kb-picker-placeholder{display:grid;place-items:center;color:var(--mut);font-size:10px}
.kb-picker-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kb-picker-chevron{color:var(--mut);font-size:13px}
.kb-exercise-picker.opens-up .kb-exercise-options{top:auto;bottom:calc(100% + 5px)}
.kb-exercise-options{position:absolute;z-index:4;top:calc(100% + 5px);left:0;right:0;max-height:var(--kb-options-max-height,220px);overflow:auto;overscroll-behavior:contain;padding:4px;border:1px solid var(--line);border-radius:14px;background:var(--card);box-shadow:0 10px 24px #0003}
.kb-exercise-option{display:flex;align-items:center;gap:8px;width:100%;min-height:42px;padding:5px 8px;border:0;border-radius:10px;background:transparent;text-align:left}
.kb-exercise-option[aria-selected=true]{background:var(--soft)}
.kb-add-controls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) 44px repeat(3,minmax(0,1fr)) 38px;gap:3px;margin-top:7px}
.kb-qty-button{min-width:0;min-height:38px;padding:0 1px;font-size:11px;font-variant-numeric:tabular-nums}
.kb-qty{width:100%;min-width:0;min-height:38px;padding:4px 2px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums}
.kb-add-button{display:grid;place-items:center;width:38px;min-height:38px;padding:0;background:var(--acc);color:var(--onacc);border-color:var(--acc);border-radius:12px}
.kb-add-button svg{width:20px;height:20px}
.kb-workout-actions{display:flex;gap:8px}
.kb-workout-actions button{min-height:42px;padding:7px 12px}
.kb-workout-actions .pri{flex:1}
body.kb-active{padding:calc(env(safe-area-inset-top,0px) + 10px) 12px calc(env(safe-area-inset-bottom,0px) + 78px)}
body.kb-active main{height:calc(100dvh - 88px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
body.kb-active .kb-workout{height:100%}
@media(prefers-reduced-motion:no-preference){button{transition:transform .1s,background-color .15s}button:active{transform:scale(.97)}}
</style></head>
<body><main id="v"></main>
<nav id="nav"></nav>
<dialog id="exercise-dialog" class="exercise-dialog" aria-label="Exercise illustration"><div id="exercise-dialog-content"></div></dialog>
<script>
const K='pu_v1',A='pu_active',$=s=>document.querySelector(s);
const KB_EXERCISES=[
  ['swing','Two-hand swing'],['goblet-squat','Goblet squat'],['deadlift','Deadlift'],
  ['clean','Clean'],['press','Overhead press'],['snatch','Snatch'],
  ['row','Bent-over row'],['lunge','Reverse lunge'],['turkish-get-up','Turkish get-up'],['halo','Halo'],
  ['around-the-world','Around the world'],['side-bend','Side bend'],['biceps-curl','Biceps curl'],
  ['shrug','Shrug'],['upright-row','Upright row'],['one-arm-row','One-arm row'],
  ['push-press','Push press'],['front-rack-squat','Front-rack squat'],['single-arm-swing','Single-arm swing'],
  ['figure-eight','Figure eight'],['windmill','Windmill'],['floor-press','Floor press'],
  ['reverse-lunge','Reverse lunge (goblet hold)']
];
const KB_ILLUSTRATIONS={
  swing:['kettlebell-swing','Kettlebell Swing'],
  'goblet-squat':['goblet-squat','Goblet Squat'],
  deadlift:['kettlebell-deadlift','Kettlebell Deadlift'],
  clean:['kettlebell-swing-clean','Kettlebell Swing Clean'],
  press:['one-arm-kettlebell-shoulder-press','One Arm Kettlebell Shoulder Press'],
  snatch:['double-kettlebell-swing-snatch','Double Kettlebell Swing Snatch','Double-kettlebell variation.'],
  row:['one-arm-kettlebell-row','One Arm Kettlebell Row','One-arm row variation.'],
  lunge:['kettlebell-reverse-lunge','Kettlebell Reverse Lunge'],
  'turkish-get-up':['kettlebell-turkish-get-ups','Kettlebell Turkish Get Ups'],
  halo:['kettlebell-halo','Kettlebell Halo'],
  'side-bend':['dumbbell-side-bend','Dumbbell Side Bend','Closest free illustration; shown with a dumbbell.'],
  'biceps-curl':['one-arm-kettlebell-bicep-curl','One Arm Kettlebell Bicep Curl'],
  shrug:['kettlebell-shrug','Kettlebell Shrug'],
  'upright-row':['dumbbell-upright-row','Dumbbell Upright Row','Closest free illustration; shown with a dumbbell.'],
  'one-arm-row':['one-arm-kettlebell-row','One Arm Kettlebell Row'],
  'push-press':['one-arm-kettlebell-push-press','One Arm Kettlebell Push Press'],
  'front-rack-squat':['one-arm-kettlebell-front-squat','One Arm Kettlebell Front Squat','Single-arm front squat variation.'],
  'single-arm-swing':['one-arm-kettlebell-swing','One Arm Kettlebell Swing'],
  windmill:['kettlebell-windmills','Kettlebell Windmills'],
  'floor-press':['kettlebell-floor-press','Kettlebell Floor Press'],
  'reverse-lunge':['kettlebell-reverse-lunge','Kettlebell Reverse Lunge']
};
const def=()=>({history:[],plan:null,rest:60,kbHistory:[],pushTests:[],kbExercises:KB_EXERCISES.slice(0,6).map(x=>x[0]),kbOrder:KB_EXERCISES.map(x=>x[0]),kbWeight:16});
let D,act,tab='train',mode='total',editing=false,kbSetup=false,kbWeightChoice=16;
const sportByScreen={train:'push',stats:'push',more:'push'};
try{D=Object.assign(def(),JSON.parse(localStorage[K]||'{}'))}catch(e){D=def()}
try{act=JSON.parse(localStorage[A]||'null')}catch(e){act=null}
if(act?.type==='kb'&&!Array.isArray(act.sets)){
  act.sets=(act.exercises||Object.keys(act.counts||{})).flatMap(id=>{
    const reps=+act.counts?.[id]||0;
    return reps>0?[{exercise:id,reps}]:[];
  });
  act.exercise=act.exercises?.[0]||KB_EXERCISES[0][0];
  act.draftReps=10;
}
if(act?.type==='kb'){
  act.exercise=act.exercise||act.exercises?.[0]||KB_EXERCISES[0][0];
  act.draftReps=+act.draftReps>0?+act.draftReps:10;
}
const save=()=>{try{localStorage[K]=JSON.stringify(D)}catch(e){}};
const saveAct=()=>{try{act?localStorage[A]=JSON.stringify(act):localStorage.removeItem(A)}catch(e){}};
const sum=a=>a.reduce((x,y)=>x+y,0);
const fmtD=t=>new Date(t).toLocaleString([],{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
const mmss=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const nextIdx=()=>D.plan?D.plan.sessions.findIndex(s=>!s.done):-1;
if(!Array.isArray(D.kbHistory))D.kbHistory=[];
if(!Array.isArray(D.pushTests))D.pushTests=[];
if(!Array.isArray(D.kbExercises))D.kbExercises=def().kbExercises.slice();
function normalizeKbPreferences(){
  const ids=new Set(KB_EXERCISES.map(x=>x[0])),saved=Array.isArray(D.kbOrder)?D.kbOrder:[];
  D.kbOrder=[...saved.filter((id,i,a)=>ids.has(id)&&a.indexOf(id)===i),...KB_EXERCISES.map(x=>x[0]).filter(id=>!saved.includes(id))];
  D.kbExercises=[...new Set(D.kbExercises.filter(id=>ids.has(id)))];
  if(!(D.kbWeight>0))D.kbWeight=16;
}
normalizeKbPreferences();
kbWeightChoice=D.kbWeight;

/* ---------- Training ---------- */
function start(pi){
  const s=pi>=0?D.plan.sessions[pi]:null;
  act={type:'push',t0:Date.now(),sets:[],pi:pi,cur:s&&!s.test?s.sets[0]:10,restEnd:0};
  saveAct();wake();render();
}
function startMaxTest(){
  act={type:'push-test',t0:Date.now(),cur:0,pi:-1,sets:[],restEnd:0};
  saveAct();wake();render();
}
function startKb(){
  const weight=+kbWeightChoice;
  if(!(weight>0)){alert('Choose a kettlebell weight greater than zero.');return}
  D.kbWeight=weight;
  act={type:'kb',t0:Date.now(),weight,sets:[],exercises:D.kbExercises.slice(),exercise:D.kbExercises[0]||'',draftReps:10};
  kbSetup=false;save();saveAct();wake();render();
}
function setKbExercise(id){
  if(!act||act.type!=='kb'||!act.exercises.includes(id))return;
  act.exercise=id;saveAct();
}
function kbPickerThumb(id){
  const entry=KB_ILLUSTRATIONS[id];
  return entry
    ?`<img class=kb-picker-thumb src="./images/exercises/${entry[0]}.webp" alt="" loading=lazy>`
    :'<span class="kb-picker-thumb kb-picker-placeholder" aria-hidden=true>—</span>';
}
function positionKbExercisePicker(){
  const picker=$('.kb-exercise-picker');
  if(!picker?.open)return;
  const summary=picker.querySelector('summary'),rect=summary.getBoundingClientRect();
  const viewportHeight=window.visualViewport?.height||window.innerHeight;
  const viewportTop=window.visualViewport?.offsetTop||0;
  const gap=13,desired=picker.querySelector('.kb-exercise-options').scrollHeight+8;
  const navTop=$('#nav')?.getBoundingClientRect().top??viewportTop+viewportHeight;
  const viewportBottom=Math.min(viewportTop+viewportHeight,navTop);
  const above=Math.max(0,rect.top-viewportTop-gap),below=Math.max(0,viewportBottom-rect.bottom-gap);
  const openUp=above>below;
  picker.classList.toggle('opens-up',openUp);
  picker.style.setProperty('--kb-options-max-height',Math.min(desired,openUp?above:below)+'px');
}
function setupKbExercisePicker(){
  const picker=$('.kb-exercise-picker');
  if(picker)picker.addEventListener('toggle',()=>{
    if(picker.open)positionKbExercisePicker();
    else picker.style.removeProperty('--kb-options-max-height');
  });
  const root=$('#v');
  if(root.dataset.kbPickerResizeReady)return;
  root.dataset.kbPickerResizeReady='true';
  window.addEventListener('resize',positionKbExercisePicker);
  window.visualViewport?.addEventListener('resize',positionKbExercisePicker);
}
function setKbDraftReps(value){
  if(!act||act.type!=='kb')return;
  act.draftReps=Math.max(0,Math.floor(+value||0));saveAct();
}
function adjustKbDraftReps(delta){
  if(!act||act.type!=='kb')return;
  act.draftReps=Math.max(1,(+act.draftReps||1)+delta);
  const input=$('#kb-reps');if(input)input.value=act.draftReps;
  saveAct();
}
function addKbSet(){
  if(!act||act.type!=='kb'||!act.exercises.includes(act.exercise))return;
  const reps=Math.floor(+act.draftReps||0);
  if(reps<1)return;
  act.sets.push({exercise:act.exercise,reps});
  saveAct();render();
}
function removeKbSet(index){
  if(!act||act.type!=='kb')return;
  act.sets.splice(index,1);saveAct();render();
}
function kbImageButton(id,name){
  const entry=KB_ILLUSTRATIONS[id];
  return entry
    ?`<button type=button class=exercise-thumb-button onclick="openExerciseImage('${id}')" aria-label="View ${name} illustration" title="View exercise image"><img src="./images/exercises/${entry[0]}.webp" alt="" loading=lazy></button>`
    :`<span class=exercise-thumb-placeholder aria-label="No illustration available">No image</span>`;
}
function openExerciseImage(id){
  const name=KB_EXERCISES.find(x=>x[0]===id)?.[1]||'Kettlebell exercise',entry=KB_ILLUSTRATIONS[id],dialog=$('#exercise-dialog');
  const picture=entry
    ?`<img class=exercise-picture src="./images/exercises/${entry[0]}.webp" alt="${entry[1]} exercise illustration" loading=eager><p class=exercise-picture-note>${entry[2]||entry[1]+' · static illustration'}</p>`
    :'<div class=exercise-no-picture>No static illustration is available for this movement yet.</div><p class=exercise-picture-note>Check back later as the free exercise catalog grows.</p>';
  $('#exercise-dialog-content').innerHTML=`<div class=exercise-dialog-content><div class=exercise-dialog-head><div><p class=eyebrow>Kettlebell exercise</p><h2>${name}</h2></div><button type=button class=exercise-dialog-close aria-label="Close image" onclick="closeExerciseImage()">×</button></div>${picture}<p class=exercise-credit>Exercise data by <a href="https://repdb.co" target=_blank rel="noopener noreferrer">RepDB (repdb.co)</a> · <a href="https://github.com/RepDB/exercise-dataset/blob/main/LICENSE-DATA.md" target=_blank rel="noopener noreferrer">free image license</a></p></div>`;
  const image=dialog.querySelector('.exercise-picture');
  if(image)image.addEventListener('error',()=>{image.outerHTML='<div class=exercise-no-picture>Illustration could not be loaded.</div>'},{once:true});
  if(!dialog.open)dialog.showModal();
}
function closeExerciseImage(){
  const dialog=$('#exercise-dialog');
  if(dialog.open)dialog.close();
}
$('#exercise-dialog').addEventListener('click',event=>{
  if(event.target===$('#exercise-dialog'))closeExerciseImage();
});

function logSet(){

    D.pushTests.push({id:Date.now(),t:act.t0,end:Date.now(),reps});
    save();act=null;saveAct();tab='stats';render();return;
  }
  if(act.type==='kb'){
    const counts=act.sets.reduce((totals,set)=>{
      totals[set.exercise]=(totals[set.exercise]||0)+(+set.reps||0);return totals;
    },{});
    const reps=act.sets.reduce((total,set)=>total+(+set.reps||0),0);
    if(!reps){act=null;saveAct();render();return}
    D.kbHistory.push({id:Date.now(),t:act.t0,end:Date.now(),weight:act.weight,counts,sets:act.sets,exercises:act.exercises,reps,kg:reps*act.weight});
    save();act=null;saveAct();tab='stats';render();return;
  }
  if(!act.sets.length){act=null;saveAct();render();return}
  const rec={id:Date.now(),t:act.t0,end:Date.now(),sets:act.sets,total:sum(act.sets),pi:act.pi,type:'push'};
  let adjustment=null;
  if(act.pi>=0&&D.plan){

    if(!ps.test){
      const expected=ps.sets.reduce((a,b)=>a+b,0),ratio=expected?Math.min(1,rec.total/expected):1;
      if(ratio<.85){
        const rate=Math.max(.55,Math.min(.95,ratio));
        const weeklyGrowth=Math.max(.02,Math.min(.08,Math.pow(P.goal/P.max,1/P.weeks)-1));
        const gentlerGrowth=Math.max(.01,weeklyGrowth*rate);
        const suggestedGoal=Math.max(P.max+1,Math.min(P.goal-1,Math.round(P.max*Math.pow(1+gentlerGrowth,P.weeks))));
        const suggestedWeeks=Math.min(24,Math.max(P.weeks+1,Math.ceil(Math.log(P.goal/P.max)/Math.log(1+gentlerGrowth))));
        adjustment={week:ps.w,goal:Math.min(P.goal-1,suggestedGoal),weeks:suggestedWeeks,ratio:Math.round(ratio*100),sourceId:rec.id};

    }

}

/* ---------- Plan ---------- */
const TYPES=['Volume','Heavy','Ladder','Descending','Volume'],REST={Volume:60,Heavy:120,Ladder:60,Descending:60};
function gen(max,goal,weeks,days,w0){
  const S=[],g=Math.min(.08,Math.max(.02,Math.pow(goal/max,1/(weeks-w0))-1));
  const isTest=w=>w===weeks-1||((w+1)%3===0&&w<weeks-2);
  for(let w=w0;w<weeks;w++){
    const tw=isTest(w),i=w-w0,tm=max*Math.pow(1+g,i),r=f=>Math.max(1,Math.round(tm*f)),x=i%3===1?1:0;
    for(let d=0;d<days;d++){
      const type=TYPES[d];let f;
      if(type==='Volume')f=[.55,.5,.5,.45,.45,.4].slice(0,5+x);
      else if(type==='Heavy')f=[.7,.65,.6,.6,.55].slice(0,4+x);
      else if(type==='Ladder')f=[.4,.55,.7,.55,.4];
      else f=[.7,.6,.5,.45,.4,.4];
      let sets=f.map(r);
      if(tw)sets=sets.slice(0,Math.max(2,sets.length-1));
      S.push({w,d,type,rest:REST[type],sets,done:null});
    }
    if(tw)S.push({w,d:days,test:true,type:'Max test',rest:0,sets:[],done:null});
  }
  return S;
}
function makePlan(){
  const max=+$('#pm').value,goal=+$('#pg').value,weeks=+$('#pw').value,days=+$('#pd').value;
  if(!(max>0)){alert('Enter your current max (most push-ups in one set).');return}
  if(!(goal>max)){alert('Your goal must be higher than your current max.');return}
  const need=Math.pow(goal/max,1/weeks)-1;
  if(need>.1&&!confirm('Going from '+max+' to '+goal+' in '+weeks+' weeks needs about '+Math.round(need*100)+'% more reps per week, which is aggressive. Around '+Math.ceil(Math.log(goal/max)/Math.log(1.08))+' weeks is more realistic. Create this plan anyway?'))return;
  if(D.plan&&!editing===false&&!confirm('Replace the current plan? Plan progress will reset (workout history is kept).'))return;
  D.plan={max,goal,weeks,days,created:Date.now(),sessions:gen(max,goal,weeks,days,0)};
  delete D.pendingAdjustment;
  save();editing=false;render();
}
function delPlan(){if(confirm('Delete the plan? Workout history is kept.')){D.plan=null;delete D.pendingAdjustment;save();render()}}
function applyAdjustment(kind){
  const a=D.pendingAdjustment,P=D.plan;
  if(!a||!P)return;
  const firstWeek=a.week+1;
  const goal=kind==='goal'?Math.max(P.max+1,a.goal):P.goal;
  const weeks=kind==='weeks'?Math.max(P.weeks+1,a.weeks):P.weeks;
  P.sessions=P.sessions.filter(s=>s.w<=a.week).concat(gen(P.max,goal,weeks,P.days,firstWeek));
  P.goal=goal;P.weeks=weeks;P.adjusted=Date.now();
  delete D.pendingAdjustment;save();render();
}
function dismissAdjustment(){delete D.pendingAdjustment;save();render()}

  }
  h+=`<div class=card><p class=eyebrow>Push-up plan</p><b>Goal ${P.goal||'?'} · ${P.weeks} weeks · ${P.days} days/week</b><p class=muted>Current max ${P.max}</p><div class=bar><i style="width:${tot?done/tot*100:0}%"></i></div><p class=muted>${done} of ${tot} sessions done</p><div class=row><button onclick="editing=true;render()">Change plan</button><button class=dng onclick="delPlan()">Delete</button></div></div>`;

function chart(){
  const H=D.history.filter(h=>h.type!=='kb'&&Array.isArray(h.sets)&&h.sets.length).slice(-20);
  if(H.length<2)return '<p class=muted>Save at least two push-up workouts to see your progress chart.</p>';
  const v=H.map(h=>mode==='total'?h.total:Math.max(...h.sets)),mx=Math.max(...v)||1;

}
function drawChart(items,v,mx,unit){
  const W=320,Ht=150,p=26;
  const X2=i=>items.length===1?W/2:p+i*(W-2*p)/(items.length-1);
  const pts=v.map((x,i)=>X2(i)+','+(Ht-p-x/mx*(Ht-2*p))).join(' ');
  return `<svg viewBox="0 0 ${W} ${Ht}" role="img" aria-label="Progress chart in ${unit}"><line x1=${p} x2=${W-p} y1=${Ht-p} y2=${Ht-p} stroke="var(--line)"/><polyline points="${pts}" fill="none" stroke="var(--ok)" stroke-width=3 stroke-linejoin=round />${v.map((x,i)=>`<circle cx=${X2(i)} cy=${Ht-p-x/mx*(Ht-2*p)} r=4 fill="var(--ok)"/>`).join('')}<text x=${p} y=14 font-size=11 fill="var(--mut)">max ${mx} ${unit}</text><text x=${p} y=${Ht-8} font-size=10 fill="var(--mut)">${new Date(items[0].t).toLocaleDateString([],{day:'numeric',month:'short'})}</text><text x=${W-p} y=${Ht-8} font-size=10 text-anchor=end fill="var(--mut)">${new Date(items[items.length-1].t).toLocaleDateString([],{day:'numeric',month:'short'})}</text></svg>`;
}

  if(D.pushTests.length){

    h+=`<h2 style="margin-top:22px">Push-up max tests</h2><div class=card><p class=eyebrow>Best effort · reps in one set</p>${drawChart(tests,values,Math.max(...values,1),'reps')}</div><div class=card><b>Test history</b>${D.pushTests.slice().reverse().map(x=>`<div class=hist><div><b>${x.reps} reps</b><small>${fmtD(x.t)} · max test</small></div><button class=dng onclick="delPushTest(${x.id})" aria-label="Delete max test">✕</button></div>`).join('')}</div>`;
  }
  if(H.length||D.pushTests.length)h+='<button class=dng style="width:100%" onclick="clearStats()">Clear all statistics</button>';
  return h;
}
function vStatsKb(){
  const K=D.kbHistory;
  let h='<p class=eyebrow>Your training, over time</p><h1>Kettlebell progress</h1>';
  if(K.length){
    const kilos=K.reduce((total,x)=>total+(+x.kg||(+x.reps||0)*(+x.weight||0)),0),reps=K.reduce((total,x)=>total+(+x.reps||Object.values(x.counts||{}).reduce((a,b)=>a+(+b||0),0)),0);
    const KH=K.slice(-20),values=KH.map(x=>+x.kg||(+x.reps||0)*(+x.weight||0)),max=Math.max(...values,1);
    h+=`<div class=stats><div class=card><b>${K.length}</b><span class=muted>workouts</span></div><div class=card><b>${Math.round(kilos).toLocaleString()} kg</b><span class=muted>total volume</span></div><div class=card><b>${reps.toLocaleString()}</b><span class=muted>total reps</span></div><div class=card><b>${Math.round(Math.max(...values)).toLocaleString()} kg</b><span class=muted>best workout</span></div></div><div class=card><p class=eyebrow>Volume per workout</p>${KH.length<2?'<p class=muted>Save another kettlebell workout to see your progress chart.</p>':drawChart(KH,values,max,'kg')}</div><div class=card><b>Kettlebell history</b>${K.slice().reverse().map(x=>{const count=+x.reps||Object.values(x.counts||{}).reduce((a,b)=>a+(+b||0),0),volume=+x.kg||count*(+x.weight||0);return `<div class=hist><div><b>${Math.round(volume).toLocaleString()} kg · ${count} reps</b><small>${fmtD(x.t)} · ${x.weight} kg kettlebell</small></div><button class=dng onclick="delKB(${x.id})" aria-label="Delete kettlebell workout">✕</button></div>`}).join('')}</div>`;
  }else h+='<div class=card><p class=muted>No kettlebell workouts yet. Start a session to see your volume progress here.</p></div>';
  if(K.length)h+='<button class=dng style="width:100%" onclick="clearStats()">Clear all statistics</button>';

/* ---------- More ---------- */
function setRest(v){D.rest=+v;save()}
function persistKbOrder(){
  const rows=Array.from(document.querySelectorAll('.checkrow[data-exercise]'));
  D.kbOrder=rows.map(row=>row.dataset.exercise);
  D.kbExercises=rows.filter(row=>row.querySelector('[name=kbx]').checked).map(row=>row.dataset.exercise);
  save();
}
function moveKbRow(handle,direction){
  const row=handle.closest('.checkrow'),other=direction<0?row?.previousElementSibling:row?.nextElementSibling;
  if(!row||!other)return;
  if(direction<0)row.parentNode.insertBefore(row,other);else row.parentNode.insertBefore(other,row);
  persistKbOrder();
}
let kbDrag=null;
function setupKbReorder(){
  const root=$('#v');
  if(root.dataset.kbReorderReady)return;
  root.dataset.kbReorderReady='true';
  root.addEventListener('change',event=>{
    if(!event.target.matches('[name=kbx]'))return;
    const rows=Array.from(root.querySelectorAll('.checkrow[data-exercise]'));
    if(!rows.some(item=>item.querySelector('[name=kbx]').checked)){
      event.target.checked=true;alert('Keep at least one exercise selected for your workout screen.');return;
    }
    D.kbExercises=rows.filter(item=>item.querySelector('[name=kbx]').checked).map(item=>item.dataset.exercise);save();
  });
  root.addEventListener('pointerdown',event=>{
    const handle=event.target.closest('[data-drag-handle]');
    if(!handle)return;
    event.preventDefault();
    const row=handle.closest('.checkrow'),rect=row.getBoundingClientRect(),placeholder=document.createElement('div');
    placeholder.className='checkrow-placeholder';placeholder.style.height=rect.height+'px';row.parentNode.insertBefore(placeholder,row);
    row.classList.add('dragging');row.style.width=rect.width+'px';row.style.left=rect.left+'px';row.style.top=rect.top+'px';
    kbDrag={row,placeholder,pointerId:event.pointerId,offsetY:event.clientY-rect.top,moved:false};
  });
  root.addEventListener('keydown',event=>{
    const handle=event.target.closest('[data-drag-handle]');
    if(!handle)return;
    const direction=event.key==='ArrowUp'?-1:event.key==='ArrowDown'?1:0;
    if(direction){event.preventDefault();moveKbRow(handle,direction)}
  });
  document.addEventListener('pointermove',event=>{
    if(!kbDrag||event.pointerId!==kbDrag.pointerId)return;
    kbDrag.moved=true;kbDrag.row.style.top=Math.max(0,event.clientY-kbDrag.offsetY)+'px';
    if(event.clientY<75)window.scrollBy(0,-14);
    else if(event.clientY>window.innerHeight-75)window.scrollBy(0,14);
    const target=document.elementsFromPoint(event.clientX,event.clientY).map(el=>el.closest?.('.checkrow[data-exercise]')).find(row=>row&&row!==kbDrag.row);
    if(!target||target.parentNode!==kbDrag.placeholder.parentNode)return;
    const rect=target.getBoundingClientRect();
    const before=event.clientY<rect.top+rect.height/2;
    if(before&&kbDrag.placeholder!==target.previousElementSibling)target.parentNode.insertBefore(kbDrag.placeholder,target);
    else if(!before&&kbDrag.placeholder!==target.nextElementSibling)target.parentNode.insertBefore(kbDrag.placeholder,target.nextSibling);
  });
  const finish=event=>{
    if(!kbDrag||event.pointerId!==kbDrag.pointerId)return;
    const drag=kbDrag;kbDrag=null;
    drag.placeholder.parentNode.insertBefore(drag.row,drag.placeholder);drag.placeholder.remove();
    drag.row.classList.remove('dragging');drag.row.style.width='';drag.row.style.left='';drag.row.style.top='';
    if(drag.moved)persistKbOrder();
  };
  document.addEventListener('pointerup',finish);
  document.addEventListener('pointercancel',finish);
}
function exp(){
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D)],{type:'application/json'}));
  a.download='groundwork-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();
}
function imp(inp){
  const f=inp.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const x=JSON.parse(r.result);if(!Array.isArray(x.history))throw 0;if(confirm('Replace current data with this backup?')){D=Object.assign(def(),x);normalizeKbPreferences();save();render()}}catch(e){alert('This file is not a valid backup.')}};
  r.readAsText(f);
}
function vMore(){
  return sportByScreen.more==='kb'?vMoreKb():vMorePush();
}
function vMorePush(){
  return `<p class=eyebrow>Personalize your training</p><h1>Push-up settings</h1>
  <div class=card><label for=rs>Rest timer between sets</label><select id=rs onchange="setRest(this.value)">${[0,30,45,60,90,120,180].map(x=>`<option value=${x} ${x==D.rest?'selected':''}>${x?x+' seconds':'Off'}</option>`).join('')}</select></div>${moreShared()}`;
}
function vMoreKb(){
  return `<p class=eyebrow>Personalize your training</p><h1>Kettlebell settings</h1>
  <div class=card><p class=eyebrow>Kettlebell setup</p><h2>Exercises on your workout screen</h2><p class=muted>Select exercises or drag the grip to reorder. Changes save automatically. Tap an image to see a larger static reference.</p>${D.kbOrder.map(id=>{const [,name]=KB_EXERCISES.find(x=>x[0]===id);return `<div class=checkrow data-exercise="${id}"><button class=drag-handle type=button data-drag-handle aria-label="Drag to reorder ${name}" title="Drag to reorder" onpointerdown="event.preventDefault()">⠿</button><input type=checkbox name=kbx value="${id}" aria-label="Include ${name} in workout" ${D.kbExercises.includes(id)?'checked':''}><span class=exercise-name>${name}</span>${kbImageButton(id,name)}</div>`}).join('')}<label for=kbdefault>Default kettlebell · kg</label><input id=kbdefault type=number min=1 step=.5 value="${D.kbWeight}" onchange="D.kbWeight=+this.value>0?+this.value:16;kbWeightChoice=D.kbWeight;save();render()"></div>${moreShared()}`;
}
function moreShared(){
  return `<div class=card><p class=muted>Exercise data by <a href="https://repdb.co" target=_blank rel="noopener noreferrer">RepDB (repdb.co)</a>.</p></div><div class=card><b>Backup</b><p class=muted>Export includes your push-up progress, plans, kettlebell workouts, and settings.</p><div class=row><button onclick="exp()">Export</button><button onclick="$('#imp').click()">Import</button></div><input id=imp type=file accept=application/json hidden onchange="imp(this)"></div>
  <div class=card><b>Install on your phone</b><p class=muted>Android Chrome: menu → Install app. iPhone Safari: Share → Add to Home Screen. The screen stays awake during a workout.</p></div>`;
}

/* ---------- Shell ---------- */
const TABS=[['train','Train'],['plan','Plan'],['stats','Progress'],['more','More']];
function setSport(screen,sport){sportByScreen[screen]=sport;if(screen==='train')kbSetup=false;render()}
function sportSwitcher(screen){

}
function render(){
  document.body.classList.toggle('kb-active',tab==='train'&&act?.type==='kb');
  $('#nav').innerHTML=TABS.map(t=>`<button class="${tab==t[0]?'on':''}" onclick="tab='${t[0]}';render()">${t[1]}</button>`).join('');
  $('#v').innerHTML={train:vTrain,plan:vPlan,stats:vStats,more:vMore}[tab]();

  if(tab==='more'&&sportByScreen.more==='kb')setupKbReorder();
}
render();
